<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Sound-Awareness HUD</title>
  </head>
  <body>
    <div id="app">
      <video id="cam" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
      <div id="banner" class="banner hidden"></div>
      <div id="controls">
        <button data-mode="all" class="mode-btn active">all</button>
        <button data-mode="important" class="mode-btn">important</button>
        <button data-mode="quiet" class="mode-btn">quiet</button>
        <button id="mic-btn" class="mic-btn" title="Stream this device's microphone to the backend (§4.6 audio)">mic</button>
        <button id="orient-btn" class="mic-btn" title="Use the phone's orientation sensor to pan bearings as you turn">imu</button>
        <button id="hat-btn" class="mic-btn" title="Connect to the ESP32 hat's direction broadcast (relayed by the backend)">connect</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
